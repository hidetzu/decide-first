<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decide First</title>
<meta name="description" content="この GitHub Issue を AI Coding Agent へ渡して大丈夫か？渡す前に人間が決めることを、短く示します。">
<meta property="og:type" content="website">
<meta property="og:title" content="Decide First">
<meta property="og:description" content="この GitHub Issue を AI Coding Agent へ渡して大丈夫か？渡す前に人間が決めることを、短く示します。">
<meta property="og:url" content="https://decide-first.hidetzu.work/">
<meta property="og:image" content="https://decide-first.hidetzu.work/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #ffffff;
    --ready: #15803d; --clarify: #a16207; --not: #b91c1c; --accent: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --card: #292524;
      --ready: #4ade80; --clarify: #facc15; --not: #f87171; --accent: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: inherit; background: var(--card);
          border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 10px 16px; font: inherit; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--bg); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #result { margin-top: 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .issue { color: var(--muted); font-size: .9rem; margin: 0 0 8px; overflow-wrap: anywhere; }
  .verdict { font-size: 1.5rem; font-weight: 700; margin: 0 0 12px; }
  .READY { color: var(--ready); } .NEEDS_CLARIFICATION { color: var(--clarify); } .NOT_READY { color: var(--not); }
  ol { padding-left: 1.4em; margin: 8px 0 0; }
  details { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; color: var(--accent); }
  .checks { list-style: none; padding: 0; margin: 12px 0 0; }
  .checks li { padding: 6px 0; }
  .mark-met { color: var(--ready); } .mark-missing { color: var(--not); }
  .evidence { display: block; color: var(--muted); font-size: .85rem; padding-left: 1.4em; }
  /* Each decision opens to its grounds and a template (docs/adr/0008). */
  ol { display: grid; gap: 6px; }
  details.decision { margin: 0; border: 0; padding: 0; }
  details.decision summary { list-style: none; display: block; color: var(--fg); }
  details.decision summary::-webkit-details-marker { display: none; }
  details.decision summary::after { content: "根拠と例 ▸"; margin-left: 6px; font-size: .75rem; color: var(--accent); white-space: nowrap; }
  details.decision[open] summary::after { content: "閉じる ▾"; }
  details.decision summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .grounds { display: block; color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .source { display: block; color: var(--muted); font-size: .75rem; }
  .example { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
             font: .8rem/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .error { color: var(--not); }
  /* Example, footer (owner's wording on hidetzu/decide-first#37). */
  .try { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
  .linkish { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; text-decoration: underline; cursor: pointer; }
  .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  footer.site { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
  footer.site p { margin: 0 0 4px; }
  footer.site a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Decide First</h1>
  <p class="lead">この GitHub Issue を AI Coding Agent へ渡して大丈夫か？渡す前に人間が決めることを、短く示します。</p>
  <form id="form">
    <input id="url" type="url" required placeholder="https://github.com/owner/repo/issues/123" aria-label="GitHub Issue URL">
    <button id="go" type="submit">判定</button>
  </form>
  <p class="try">例で試す: <button type="button" class="linkish" id="example" data-url="https://github.com/cli/cli/issues/14627">cli/cli#14627</button></p>
  <div id="result" aria-live="polite"></div>
  <footer class="site">
    <p>入力した URL の Issue を、GitHub から読むだけです。保存も書き込みもしません。public repository の Issue だけが対象です。</p>
    <p><a href="https://github.com/hidetzu/decide-first">GitHub</a> · <a href="https://github.com/hidetzu/decide-first/releases/tag/v0.1.0">できること・できないこと</a> · MIT License</p>
  </footer>
</main>
<script type="module">
  import { renderEvaluation } from "/view.js";
  const $ = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    Object.assign(el, attrs);
    el.append(...kids);
    return el;
  };
  const form = document.getElementById("form"), input = document.getElementById("url");
  const go = document.getElementById("go"), out = document.getElementById("result");

  // "例で試す": put the example URL in the box and judge it, as if typed.
  document.getElementById("example").addEventListener("click", (ev) => {
    input.value = ev.currentTarget.dataset.url;
    form.requestSubmit();
  });

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    go.disabled = true;
    out.replaceChildren($("p", { className: "lead", textContent: "取得しています…" }));
    try {
      const res = await fetch("/api/evaluate?url=" + encodeURIComponent(input.value));
      const data = await res.json();
      // ⚠ renderEvaluation escapes every string that came from the issue (src/web/view.js).
      if (data.ok) out.innerHTML = renderEvaluation(data.evaluation);
      else out.replaceChildren($("p", { className: "error", textContent: data.message }));
    } catch {
      out.replaceChildren($("p", { className: "error", textContent: "サーバに接続できませんでした。再度お試しください。" }));
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
