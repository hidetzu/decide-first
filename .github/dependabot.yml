# Updates as PRs, once a month (owner decision on hidetzu/decide-first#32).
# ⚠ Actions are pinned to a commit SHA (test/deploy.test.ts): without this, nothing says when a
#   pinned action falls behind. Dependabot rewrites the SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # ⚠ @types/node follows the lower bound of package.json "engines" (Node 22.18), not the
      #   newest Node: with newer types, tsc stops noticing an API that Node 22 lacks. Raise it
      #   together with "engines" (owner decision on hidetzu/decide-first#35, 2026-10-10).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
